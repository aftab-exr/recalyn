services:
  - type: web
    name: recalyn-api
    runtime: python
    plan: free
    rootDir: recalyn-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
