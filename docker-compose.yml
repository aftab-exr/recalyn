services:
  api:
    build:
      context: ./recalyn-api
      dockerfile: Dockerfile
    container_name: recalyn-api
    ports:
      - "8000:8000"
    env_file:
      - ./recalyn-api/.env
    environment:
      - DATABASE_URL=sqlite:////data/recalyn.db
    volumes:
      - recalyn_sqlite:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  recalyn_sqlite:
